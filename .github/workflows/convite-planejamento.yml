name: Convite do Planejamento Financeiro

# Só manual. Envia o convite (com link pessoal para o formulário) aos clientes que têm convite pendente
# em planejamento_convites. Não cadastra ninguém em lugar nenhum.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar as contagens, sem enviar"
        type: boolean
        default: true
      test_to:
        description: "Enviar o convite só para este e-mail (teste; não grava nada)"
        type: string
        default: ""

concurrency:
  group: convite-planejamento
  cancel-in-progress: false

jobs:
  convite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enviar o convite
        run: node scripts/convite-planejamento.mjs
        env:
          TZ: America/Sao_Paulo
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://sagafin.com.br
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TEST_TO: ${{ inputs.test_to }}
