name: Relatório Social Semanal

on:
  schedule:
    # Segunda, 11:17 UTC = 08:17 em Brasília.
    - cron: "17 11 * * 1"
  workflow_dispatch:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ranking de posts por leads
        run: node scripts/social-relatorio.mjs
        env:
          TZ: America/Sao_Paulo
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APROVADOR_EMAIL: ${{ secrets.APROVADOR_EMAIL }}
