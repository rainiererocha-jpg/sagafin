name: Diário Saga

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília (dias úteis). Feriados da B3 são
    # pulados pelo próprio script (scripts/feriados-b3.json).
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Rodar mesmo em fim de semana/feriado (teste)"
        type: boolean
        default: false
      dry_run:
        description: "Gerar o texto sem publicar nem enviar e-mail"
        type: boolean
        default: false

concurrency:
  group: diario-saga
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar, publicar e enviar o Diário Saga
        run: node scripts/diario-saga.mjs
        env:
          TZ: America/Sao_Paulo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://sagafin.com.br
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
