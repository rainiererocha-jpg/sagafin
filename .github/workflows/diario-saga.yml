name: Diário Saga

on:
  schedule:
    # RESERVA. O disparo principal vem de uma tarefa agendada do Claude às 08:47 (Brasília),
    # que chama esta workflow por API, porque o agendador do GitHub passou a atrasar horas
    # (em nov/2026 o e-mail das 9h chegou às 19h). Estes horários ficam só de reserva:
    # o script não repete se o post do dia já existe e não envia depois das 12h de Brasília.
    # 11:10 e 12:10 UTC = 08:10 e 09:10 em Brasília (dias úteis).
    - cron: "10 11,12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Rodar mesmo em fim de semana/feriado (teste)"
        type: boolean
        default: false
      dry_run:
        description: "Gerar o texto sem publicar nem enviar e-mail"
        type: boolean
        default: false

concurrency:
  group: diario-saga
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar, publicar e enviar o Diário Saga
        run: node scripts/diario-saga.mjs
        env:
          TZ: America/Sao_Paulo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://sagafin.com.br
          FORCE_RUN: ${{ inputs.force && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
